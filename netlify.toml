[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[build.processing.js]
  bundle = false
  minify = false

[build.processing.css]
  bundle = false
  minify = false

[build.processing.html]
  pretty_urls = true

# Was set per-request in index.astro before this app went static.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/docs/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/docs.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/docs/llms*.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[redirects]]
  from = "/docs/getting-started/firewall"
  to = "/docs/getting-started/quip-sdk"
  status = 301
[[redirects]]
  from = "/docs/basics/quip-the-quantum-unit-interlock-pathway"
  to = "/docs/quip-interlock-protocol/quip-the-quantum-unit-interlock-pathway"
  status = 301
[[redirects]]
  from = "/docs/basics/quip-lifecycle"
  to = "/docs/quip-interlock-protocol/quip-lifecycle"
  status = 301
[[redirects]]
  from = "/docs/interlock/how-quip-fits-together"
  to = "/docs/quip-interlock-protocol/how-quip-fits-together"
  status = 301
[[redirects]]
  from = "/docs/interlock/quip-accounts"
  to = "/docs/quip-interlock-protocol/quip-accounts"
  status = 301
[[redirects]]
  from = "/docs/interlock/quipswap"
  to = "/docs/quip-interlock-protocol/quipswap"
  status = 301
[[redirects]]
  from = "/docs/protocols/encrypt"
  to = "/docs/quip-interlock-protocol/quip-accounts"
  status = 301
[[redirects]]
  from = "/docs/protocols/accelerate"
  to = "/docs/compute/submit-a-job"
  status = 301
[[redirects]]
  from = "/docs/basics/virtues"
  to = "/docs/quip-interlock-protocol/quip-the-quantum-unit-interlock-pathway"
