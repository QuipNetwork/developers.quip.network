[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[build.processing.js]
  bundle = false
  minify = false

[build.processing.css]
  bundle = false
  minify = false

[build.processing.html]
  pretty_urls = true

# Was set per-request in index.astro before this app went static.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# The .md twins and the llms dumps are the same content as the HTML pages, and
# a text/markdown response cannot carry a <link rel="canonical">. Left
# indexable they would be a second crawlable copy of all 19 pages on the very
# host this migration exists to make canonical. noindex keeps them fully
# fetchable for agents — which is the whole point of them — while keeping them
# out of the index. quip.gitbook.io already sends noindex on its equivalents.
[[headers]]
  for = "/docs/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/docs.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/docs/llms*.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    X-Robots-Tag = "noindex"

# The XQuad book is served at /docs/xquad/*, so the toolchain page moved out of its
# prefix to /docs/xquad-toolchain (QUI-1331). Both URLs were published, so both get a
# redirect -- the .md twin because the docs document appending .md to any page URL.
# These sit ahead of the legacy block because they are the only rules that share a
# prefix with real files; Netlify serves a matching file before any redirect, and the
# book has no toolchain page, so nothing here shadows the book.
[[redirects]]
  from = "/docs/xquad/toolchain"
  to = "/docs/xquad-toolchain"
  status = 301
[[redirects]]
  from = "/docs/xquad/toolchain.md"
  to = "/docs/xquad-toolchain.md"
  status = 301

