# SPDX-License-Identifier: AGPL-3.0-or-later
#
# This repo does NOT deploy from CI.
#
# CI builds the site's Docker image and pushes it to this project's registry. The
# server pulls new tags on its own (deploy/README.md). There is exactly one path from
# a commit to the site, and CI hands off at the registry.
#
# NEVER ADD A DEPLOY JOB HERE. Two deploy paths pointed at one site is a race between
# a stale artifact and a fresh one, and the loser is whichever finishes second.
#
# refresh-data below COMMITS, which is not the same thing as deploying and does not
# break that rule. It pushes regenerated data files to the default branch; the image
# job then does what it does for any other commit.
#
# The checks run on a schedule, on a manual "Run pipeline", and on merge requests,
# deliberately NOT on branch pushes, because a push must not go red because someone
# else's CDN is having a bad afternoon. Pushes to main and to the fumadocs branch run
# only the image jobs. A "trigger" pipeline (xquad's release hook) rebuilds the image so
# the book stays current.

include:
  - project: quip.network/ci-templates
    ref: v1.2.0
    file: templates/dependency-gate.yml

stages: [check, refresh, image]

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "trigger"
    - if: $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "fumadocs")

.checks-only:
  rules:
    - if: ($CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH) || $CI_PIPELINE_SOURCE == "trigger"
      when: never
    - when: on_success

# Kaniko builds without a Docker daemon, which these runners do not allow. Google archived
# kaniko, so this is the maintained fork the trustee's build uses, pinned the same way. The
# GPU hosts mount NVIDIA firmware under /lib: --ignore-path=/lib stops kaniko replacing it,
# and the symlink in before_script restores the path RUN steps load their libraries from.
# Neither reaches the image.
.image-job:
  stage: image
  tags: [linux, amd64, docker]
  rules:
    - if: ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "trigger") && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "fumadocs")
  variables:
    # A rebuild of the same commit (an xquad release) must not overwrite the image a
    # rollback would name, so every build gets its own tag.
    BUILD_TAG: "$CI_COMMIT_SHORT_SHA-$CI_PIPELINE_ID"

build-image:
  extends: .image-job
  image:
    name: ghcr.io/osscontainertools/kaniko:v1.29.0-debug@sha256:350929376b8a69afb1d8b362086c809e4ef6799fa1bcb317c2806ae1447b3845
    entrypoint: [""]
  interruptible: true
  timeout: 45m
  before_script:
    - mkdir -p /lib && ln -sfn /usr/lib/x86_64-linux-gnu /lib/x86_64-linux-gnu
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  script:
    # NEXT_PUBLIC_UMAMI_* are public values, set as project CI variables when wanted.
    - |
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
        --ignore-path=/lib \
        --build-arg GIT_COMMIT="$CI_COMMIT_SHA" \
        --build-arg BUILD_PIPELINE="$CI_PIPELINE_ID" \
        --build-arg NEXT_PUBLIC_UMAMI_SRC="${NEXT_PUBLIC_UMAMI_SRC:-https://cloud.umami.is/script.js}" \
        --build-arg NEXT_PUBLIC_UMAMI_WEBSITE_ID="${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}" \
        --destination "$CI_REGISTRY_IMAGE:$BUILD_TAG"

# The job runs inside the image it is testing, so a bad build never gets the branch tag
# the servers follow, and never restarts the site on every check.
smoke-image:
  extends: .image-job
  needs: [build-image]
  image:
    name: $CI_REGISTRY_IMAGE:$BUILD_TAG
    entrypoint: [""]
  interruptible: true
  timeout: 5m
  variables:
    GIT_DEPTH: "1"
  script:
    - (cd /app && exec node server.js) &
    - EXPECT_COMMIT="$CI_COMMIT_SHA" node scripts/smoke.mjs http://127.0.0.1:3000

# Moves the branch tag the servers follow. This is the release; the servers do the rest.
# One at a time per branch, and never backwards: pipeline ids only rise, so a build that
# finishes late cannot replace a newer image. Going back on purpose is the host's portal-pin.
promote-image:
  extends: .image-job
  needs: [smoke-image]
  image:
    name: gcr.io/go-containerregistry/crane/debug:v0.22.1@sha256:e78770b31258a3846f878036d9c1f63fbe4c871f9f56990bf77fd95c013e3c1b
    entrypoint: [""]
  interruptible: false
  resource_group: promote-$CI_COMMIT_REF_SLUG
  timeout: 5m
  variables:
    GIT_STRATEGY: none
  script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | crane auth login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      live=$(crane config "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" 2>/dev/null | grep -o '"build-pipeline":"[0-9]*"' | grep -o '[0-9][0-9]*' | head -1)
      if [ "${live:-0}" -gt "$CI_PIPELINE_ID" ]; then
        echo "$CI_COMMIT_REF_SLUG is already on pipeline $live, newer than $CI_PIPELINE_ID; leaving it."
        exit 0
      fi
    - crane tag "$CI_REGISTRY_IMAGE:$BUILD_TAG" "$CI_COMMIT_REF_SLUG"

link-health:
  extends: .checks-only
  stage: check
  # No install step: scripts/check-links.mjs has zero dependencies, on purpose.
  image: node:22-alpine
  interruptible: true
  timeout: 10m
  # Explicit. A red probe is a red pipeline; that is the entire point of it.
  allow_failure: false
  script:
    - node --version
    - node scripts/check-links.mjs
  artifacts:
    # `always`, so a FAILING run still uploads the report that explains why.
    when: always
    expire_in: 30 days
    paths:
      - link-health.json

# Deliberately a SEPARATE job rather than another line in link-health, so the
# job name in the failure notification says which kind of rot was found. "A URL
# died" and "the published figures no longer match the chain" want different
# people and different fixes, and reading a log to tell them apart is exactly
# the friction that gets alerts muted.
snapshot-drift:
  extends: .checks-only
  stage: check
  image: node:22-alpine
  interruptible: true
  timeout: 10m
  allow_failure: false
  script:
    - node scripts/recount-network.mjs --check

# Regenerate the published figures and commit them (QUI-1340).
#
# Runs AFTER snapshot-drift on purpose. snapshot-drift judges what is currently
# published, so it has to see the tree before this job moves it. Its age bound is
# now two days, which means a red snapshot-drift no longer says "the network grew"
# — it says THIS JOB HAS STOPPED RUNNING. That is the alert worth having.
#
# Every guard that decides whether today's data is fit to publish lives in the
# scripts, not here, so that `node scripts/recount-nodes.mjs` behaves identically
# on a laptop. This job only decides whether to commit what they produced.
refresh-data:
  stage: refresh
  image: node:22-alpine
  # NOT interruptible. The window between commit and push is small but it is
  # real, and a cancelled job inside it leaves a commit that never reached the
  # remote — which then looks like the refresh silently doing nothing.
  interruptible: false
  timeout: 15m
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    # Manual on a "Run pipeline", so someone can force a refresh without waiting
    # for tomorrow, but never by accident.
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  variables:
    # A full clone: pushing from the default shallow checkout is refused often
    # enough to not be worth debugging at 00:17 UTC.
    GIT_DEPTH: "0"
  # The geo cache, carried between runs. This is load-bearing, not a speed-up:
  # ipwho.is allows ~10k lookups a month and a cold run spends ~170 of them, so
  # an uncached daily job runs out of allowance within a week and then publishes
  # nothing. Cached, a run only pays for addresses it has never seen.
  #
  # It lives here rather than in the repo because it maps operator IP to city,
  # and operator addresses are not ours to publish. A lost cache costs one
  # expensive run; a committed one would be a disclosure.
  cache:
    key: geo-cache-v1
    paths:
      - .geo-cache.json
  before_script:
    # The runner's helper image clones; this image needs git to commit.
    - apk add --no-cache git
    - test -n "${REFRESH_TOKEN}" || { echo "REFRESH_TOKEN is not set — cannot publish the refresh."; exit 1; }
  script:
    - node scripts/recount-nodes.mjs
    - node scripts/recount-network.mjs --write
    # Read back what we are about to publish and hold it to the same standard as
    # anything a person would have committed by hand.
    - node scripts/recount-network.mjs --check
    - |
      if git diff --quiet -- src/data; then
        echo "figures unchanged since the last run — nothing to commit, nothing to deploy"
        exit 0
      fi
      git config user.email "${REFRESH_EMAIL:-noreply@quip.network}"
      git config user.name "${REFRESH_NAME:-quip refresh bot}"
      git add src/data
      git commit -m "Refresh the published network figures

      Generated by scripts/recount-nodes.mjs and scripts/recount-network.mjs
      --write in pipeline ${CI_PIPELINE_ID}. See QUI-1340 for why this is not a
      reviewed commit: the checks that a reviewer used to make are in the
      scripts, and a run that cannot pass them writes nothing."
      git push "https://oauth2:${REFRESH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_DEFAULT_BRANCH}"
